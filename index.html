<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jacaranda, dating app prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1F6;--surface:#FCFBFD;--ink:#2B2433;--muted:#766C80;--line:#E4DDE9;
  --jac:#5E4C8F;--jac-deep:#3D3163;--jac-soft:#EAE4F3;--on-jac:#FBF9FD;
  --mari:#B08D57;--mari-soft:#F2EADC;--leaf:#4E7A65;--leaf-soft:#E4EEE8;--warn:#A63D3D;
  --bloom:#8E7CC3;--bloom-2:#B7A8DE;--bloom-3:#D8CEEF;
  --shadow:0 10px 30px -12px rgba(46,32,78,.22);
  --serif:'Cormorant Garamond','Cormorant',Garamond,'Times New Roman',serif;
  --sans:'Jost','Avenir Next','Segoe UI',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16131B;--surface:#201B27;--ink:#ECE6F1;--muted:#A69DB1;--line:#342D3D;
    --jac:#B2A2DD;--jac-deep:#D3C8F0;--jac-soft:#2B2439;--on-jac:#1A1522;
    --mari:#D4B47E;--mari-soft:#33291B;--leaf:#8DC0A6;--leaf-soft:#1F2F27;--warn:#E59A9A;
    --bloom:#9D8BD2;--bloom-2:#7C6AB3;--bloom-3:#51457A;
    --shadow:0 10px 30px -12px rgba(0,0,0,.6);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16131B;--surface:#201B27;--ink:#ECE6F1;--muted:#A69DB1;--line:#342D3D;
  --jac:#B2A2DD;--jac-deep:#D3C8F0;--jac-soft:#2B2439;--on-jac:#1A1522;
  --mari:#D4B47E;--mari-soft:#33291B;--leaf:#8DC0A6;--leaf-soft:#1F2F27;--warn:#E59A9A;
  --bloom:#9D8BD2;--bloom-2:#7C6AB3;--bloom-3:#51457A;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6);color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;font-weight:400;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.005em;margin:0;line-height:1.08}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--jac);outline-offset:3px}
img,svg{max-width:100%}

.app{max-width:460px;margin:0 auto;min-height:100%;padding-bottom:110px}
.app.no-nav{padding-bottom:36px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px 12px}
.wordmark{font-family:var(--serif);font-size:30px;font-weight:600;font-style:italic;color:var(--jac-deep);display:flex;align-items:center;gap:8px;letter-spacing:.005em;line-height:1}
.wordmark .blossom{width:26px;height:26px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:5px 12px;border-radius:999px;background:var(--jac-soft);color:var(--jac-deep);white-space:nowrap;letter-spacing:.01em}
.pill.gold{background:var(--mari-soft);color:var(--ink)}
.pill.leaf{background:var(--leaf-soft);color:var(--leaf)}
.view{padding:6px 22px 28px}
.muted{color:var(--muted)}
.small{font-size:14px}

.btn{appearance:none;border:0;font-weight:500;letter-spacing:.02em;border-radius:14px;padding:15px 18px;cursor:pointer;background:var(--jac-deep);color:var(--on-jac);width:100%;font-size:16px;display:block;text-align:center;transition:transform .15s ease,background .15s ease}
.btn:active{transform:scale(.985)}
.btn.secondary{background:transparent;color:var(--jac-deep);box-shadow:inset 0 0 0 1px var(--line)}
.btn.slim{padding:11px 16px;font-size:15px;width:auto;display:inline-block}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;margin-top:8px}
.row > *{flex:1}

/* onboarding */
.progress{height:2px;background:var(--line);margin:8px 22px 0;overflow:hidden;border-radius:2px}
.progress i{display:block;height:100%;background:var(--jac);transition:width .35s ease}
.hero{padding:30px 24px 24px;position:relative;overflow:hidden}
.hero .branch{position:absolute;right:-24px;top:-6px;width:200px;height:200px;pointer-events:none;opacity:.95}
.hero h1{font-size:50px;line-height:1.02;margin:150px 0 18px;color:var(--ink);font-weight:500;max-width:9.5em}
.hero .lede{font-size:17px;color:var(--muted);max-width:32ch}
.promise{margin:34px 0 32px;display:grid;gap:18px}
.promise > div{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.promise b{display:block;font-weight:500}
.promise .ic{width:40px;height:40px;border-radius:50%;background:var(--jac-soft);display:grid;place-items:center;font-size:17px}
.ob h2{font-size:38px;margin:22px 0 8px;font-weight:500}
.field{margin:24px 0}
.lbl{display:block;font-weight:500;margin-bottom:10px}
.hint{color:var(--muted);font-size:14px;margin-top:8px}
.err{color:var(--warn);font-size:14px;font-weight:500;margin-top:10px}
.note{background:var(--mari-soft);border-radius:14px;padding:13px 15px;font-size:14px;margin-top:12px;line-height:1.55}
input[type=text],input[type=number],input[type=tel],textarea{width:100%;font:inherit;padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);transition:border-color .15s}
input[type=text]:focus,input[type=number]:focus,input[type=tel]:focus,textarea:focus{border-color:var(--jac);outline:none}
textarea{resize:vertical;min-height:88px}
input[type=range]{width:100%;accent-color:var(--jac)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 15px;font-size:15px;cursor:pointer;transition:background .15s,border-color .15s}
.chip[aria-pressed="true"]{background:var(--jac-deep);border-color:var(--jac-deep);color:var(--on-jac)}
.slider-labels{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.ob-actions{display:flex;gap:10px;margin-top:34px}
.ob-actions .btn.secondary{flex:0 0 100px}

/* discover */
.who{padding-top:8px}
.who h1{font-size:52px;font-weight:600}
.who .meta{color:var(--muted);margin-top:6px;line-height:1.7}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.why{display:flex;gap:18px;align-items:center;padding:18px 0;margin-top:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ring{--p:80;width:76px;height:76px;border-radius:50%;background:conic-gradient(var(--jac) calc(var(--p) * 1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:66px;height:66px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:24px;line-height:1}
.ring small{display:block;font-family:var(--sans);font-size:10px;font-weight:500;color:var(--muted);margin-top:3px;letter-spacing:.04em}
.why ul{margin:0;padding:0;list-style:none;font-size:15px}
.why li{position:relative;padding-left:16px}
.why li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--bloom)}
.why li+li{margin-top:5px}
.photo{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:4/5;margin:18px 0}
.photo svg{display:block;width:100%;height:100%}
.photo .cap{position:absolute;left:14px;top:12px;font-size:12px;font-weight:500;color:#fff;background:rgba(30,20,45,.32);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:3px 10px;border-radius:999px}
.heart{position:absolute;right:12px;bottom:12px;width:50px;height:50px;border-radius:50%;border:0;background:var(--surface);color:var(--jac);cursor:pointer;box-shadow:var(--shadow);display:grid;place-items:center;transition:transform .15s}
.heart:active{transform:scale(.92)}
.panel{padding:8px 0 10px;margin:22px 0;border-top:1px solid var(--line)}
.panel h3{font-size:28px;font-weight:500;padding-top:14px;margin-bottom:4px}
.vital{display:flex;gap:12px;padding:10px 0}
.vital .k{width:26px;flex:none;text-align:center;opacity:.85}
.passion{padding:10px 0}
.passion b{display:block;font-weight:500}
.passion p{color:var(--muted);font-size:15px}
.passion .both{font-size:12px;font-weight:500;color:var(--mari);margin-left:8px;letter-spacing:.02em}
.foodrow{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0 6px}
.food{font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line)}
.food.shared{background:var(--mari-soft);border-color:transparent;font-weight:500}
.trait{padding:8px 0}
.trait .tl{display:flex;justify-content:space-between;font-size:14px}
.track{position:relative;height:4px;border-radius:2px;background:var(--line);margin:12px 8px 4px}
.track i{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--bg)}
.track .me{background:var(--jac)}
.track .them{background:var(--mari)}
.legend{display:flex;gap:18px;font-size:13px;color:var(--muted);padding:8px 0 6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.skip{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom,0px));left:max(18px,calc(50% - 212px));width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;z-index:25;display:grid;place-items:center;color:var(--muted)}
.report{display:block;margin:26px auto 0;background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.empty{text-align:center;padding:70px 14px}
.empty h2{font-size:36px;font-weight:500;margin-bottom:12px}
.empty p{color:var(--muted);margin-bottom:26px}

/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-inner{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;border:0;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--muted);cursor:pointer;position:relative}
.nav button[aria-current="page"]{color:var(--jac-deep)}
.nav button[aria-current="page"]::after{content:"";position:absolute;top:0;left:50%;width:22px;height:2px;border-radius:2px;background:var(--jac);transform:translateX(-50%)}
.nav .badge{position:absolute;top:6px;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;background:var(--mari);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}

/* sheet, overlay, toast */
.backdrop{position:fixed;inset:0;background:rgba(28,20,40,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:460px;border-radius:26px 26px 0 0;padding:24px 22px calc(24px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.sheet h2{font-size:32px;font-weight:500;margin-bottom:6px}
.quote{font-family:var(--serif);font-size:22px;line-height:1.35;border-left:2px solid var(--bloom);padding:4px 0 4px 16px;margin:16px 0 20px}
.match{position:fixed;inset:0;z-index:60;background:radial-gradient(120% 80% at 50% 0%,#4A3A78 0%,#2A2140 60%,#1D1730 100%);color:#F5F1FA;display:flex;flex-direction:column;justify-content:center;padding:32px 28px calc(32px + env(safe-area-inset-bottom,0px));text-align:center;overflow:hidden}
.match h1{font-size:64px;font-style:italic;font-weight:500;color:#F5F1FA;margin-bottom:16px}
.match p{font-size:18px;opacity:.85;max-width:30ch;margin:0 auto 36px}
.match .btn{max-width:360px;margin:0 auto 10px;background:#F5F1FA;color:#2A2140}
.match .btn.secondary{background:transparent;color:#F5F1FA;box-shadow:inset 0 0 0 1px rgba(245,241,250,.35)}
.petal{position:absolute;top:-24px;width:13px;height:15px;border-radius:60% 60% 50% 50%/70% 70% 40% 40%;background:#B7A8DE;animation:fall 4.2s ease-in forwards;opacity:.9}
.petal:nth-child(3n){background:#8E7CC3}
.petal:nth-child(4n){background:#D8CEEF}
@keyframes fall{to{transform:translate(40px,112vh) rotate(420deg)}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--jac-deep);color:var(--on-jac);padding:12px 18px;border-radius:14px;font-size:15px;z-index:70;max-width:calc(100% - 44px);box-shadow:var(--shadow)}

/* matches & chat */
.list-item{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;text-align:left;cursor:pointer}
.avatar{width:56px;height:56px;border-radius:50%;overflow:hidden;flex:none}
.avatar svg,.avatar img{width:100%;height:100%;display:block;object-fit:cover}
.list-item b{display:block;font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.2}
.list-item span{font-size:14px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.back{background:none;border:0;cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:500;color:var(--jac-deep);padding:6px 0}
.section-title{font-size:34px;font-weight:500;margin:26px 0 6px}
.plan{background:var(--surface);border-radius:20px;padding:20px;margin:14px 0;border:1px solid var(--line)}
.plan.chosen{border-color:var(--mari);box-shadow:inset 0 0 0 1px var(--mari)}
.plan h3{font-size:26px;font-weight:600}
.plan .when{font-size:14px;color:var(--muted);margin:4px 0 10px}
.stop{display:grid;grid-template-columns:30px 1fr auto;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.stop .e{font-size:19px;line-height:1.4}
.stop b{display:block;font-weight:500}
.stop small{color:var(--muted);display:block;font-size:13px}
.stop .cost{font-weight:500;white-space:nowrap}
.plan .total{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--ink);padding-top:12px;margin-top:2px;font-weight:500}
.plan .whyline{font-size:14px;color:var(--jac-deep);font-style:italic;margin:4px 0 12px}
.msgs{display:flex;flex-direction:column;gap:8px;margin:18px 0}
.msg{max-width:82%;padding:11px 15px;border-radius:20px;font-size:15px}
.msg.me{align-self:flex-end;background:var(--jac-deep);color:var(--on-jac);border-bottom-right-radius:6px}
.msg.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg .ctx{display:block;font-size:13px;opacity:.8;font-style:italic;margin-bottom:4px}
.composer{display:flex;gap:8px;margin-top:10px;align-items:center}
.composer input{flex:1}
.safety{background:var(--leaf-soft);border-radius:18px;padding:16px 18px;font-size:14px;margin:18px 0}
.safety b{color:var(--leaf);font-weight:500}
.safety ul{margin:6px 0 0;padding-left:18px}
.me-head{display:flex;gap:16px;align-items:center;margin:12px 0 6px}
.me-head .avatar{width:78px;height:78px}
.me-head h1{font-size:40px}
.brand-opt{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:8px 0;cursor:pointer}

/* gallery, voice, ratings */
.gallery{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:18px -22px;padding:0 22px;scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gallery .photo{flex:0 0 86%;scroll-snap-align:center;margin:0}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
.voice{border-top:1px solid var(--line);padding:20px 0 18px;margin:8px 0;position:relative}
.voice .q{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:.02em;padding-right:60px}
.voice.big{border:0;background:linear-gradient(150deg,#4B3B7A,#2E2448);color:#F5F1FA;border-radius:24px;padding:22px 22px 20px;margin:20px 0;overflow:hidden}
.voice.big::before{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(183,168,222,.35),transparent 70%)}
.voice.big .q{color:#F5F1FA;opacity:.8;font-family:var(--serif);font-style:italic;font-size:22px;letter-spacing:0}
.voice.big .play{background:#F5F1FA;color:#2E2448}
.voice.big .bars rect{fill:rgba(255,255,255,.3)}
.voice.big .player.on .bars rect{fill:#D8CEEF}
.voice.big .secs{color:#F5F1FA;opacity:.75}
.voice.big .pill{background:rgba(255,255,255,.12);color:#F5F1FA}
.voice.big .transcript{color:#F5F1FA}
.voice.big .btn.secondary{color:#F5F1FA;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.player{display:flex;align-items:center;gap:12px;margin-top:12px;position:relative}
.play{width:46px;height:46px;border-radius:50%;border:0;background:var(--jac-deep);color:var(--on-jac);display:grid;place-items:center;cursor:pointer;flex:none}
.bars{flex:1;height:34px;display:block}
.bars rect{fill:var(--line)}
.player.on .bars rect{fill:var(--jac);animation:pulse 1s ease-in-out infinite alternate}
.player.on .bars rect:nth-child(3n){animation-delay:.2s}
.player.on .bars rect:nth-child(3n+1){animation-delay:.4s}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
.secs{font-size:14px;font-weight:500;color:var(--muted);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.transcript{font-family:var(--serif);font-size:26px;line-height:1.25;margin-top:14px;font-weight:500}
.voice .heart{bottom:auto;top:14px;right:0;width:44px;height:44px}
.voice.big .heart{right:14px;background:#F5F1FA;color:#4B3B7A}
.vibes{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;position:relative}
.scorebar{display:grid;grid-template-columns:1.4fr 1fr 1fr;margin-top:18px;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.score{padding:12px 14px}
.score+.score{border-left:1px solid var(--line)}
.score b{display:block;font-size:32px;font-family:var(--serif);font-weight:600;line-height:1}
.score span{font-size:12px;color:var(--muted);letter-spacing:.02em}
.score.main{background:var(--mari-soft)}
.score.main b{color:var(--ink)}
.rate{border-top:1px solid var(--line);padding:8px 0 4px;margin:22px 0 0}
.rate h3{font-size:28px;font-weight:500;padding-top:14px}
.ten{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px}
.ten button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 0;font-weight:500;font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums}
.ten button[aria-pressed="true"]{background:var(--mari);border-color:var(--mari);color:#fff}
.standouts{display:flex;gap:10px;overflow-x:auto;margin:4px -22px 16px;padding:2px 22px;scrollbar-width:none}
.standouts::-webkit-scrollbar{display:none}
.so{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px 5px 5px;display:flex;align-items:center;gap:9px;cursor:pointer}
.so .avatar{width:38px;height:38px}
.so b{font-size:15px;font-weight:500;display:block;line-height:1.2}
.so span{font-size:12px;color:var(--mari);display:block;line-height:1.2}
.so-title{font-family:var(--serif);font-style:italic;font-size:20px;margin:6px 0 10px;color:var(--jac-deep)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pgrid .cell{position:relative;aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:var(--surface)}
.pgrid .cell img,.pgrid .cell svg{width:100%;height:100%;object-fit:cover;display:block}

    for(const combo of combos){
      const stops=[];let near=mid,ok=true;
      for(const t of combo){const v=nearestVenue(t,near,vegPair,stops[stops.length-1]);if(!v){ok=false;break}stops.push(v);near=v.cluster==='out'?'mal':v.cluster}
      if(!ok)continue;
      const total=stops.reduce((x,v)=>x+v.cost,0);
      if(total>2000)continue;
      const sc=base+stops.reduce((x,v)=>x+likesOf(me,p,v)*3,0)+(total>=1500?6:-4);
      if(!best||sc>best.sc)best={sc,stops,total};
    }
    if(!best)continue;
    const bothFoods=[...new Set(best.stops.filter(v=>likesOf(me,p,v)===2).map(v=>FOOD_LOW[VENUE_FOOD[v.type]]))];
    let why;
    if(shared.length)why=`You both love ${PASS[shared[0]].label.toLowerCase()}.`;
    else if(r.need)why=b?`Something ${p.name} loves, and a fun first for you.`:`Something you love, and a fun first for ${p.name}.`;
    else if(bothFoods.length)why=`Built around ${listJoin(bothFoods)}, which you both like.`;
    else why='Easy to get to for both of you.';
    out.push({id:r.id,title:r.title,time:r.time,stops:best.stops.map(v=>({name:v.name,type:v.type,cluster:v.cluster,cost:v.cost,blurb:v.blurb,sample:v.sample})),total:best.total,mid,score:best.sc,why,forMe:T[me.cluster][mid],forThem:T[p.cluster][mid]});
  }
  out.sort((x,y)=>y.score-x.score);
  return out.slice(0,3);
}

async function downscale(file){
  const url=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(file)});
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const m=720;const k=Math.min(1,m/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.72);
}

function partText(p,part){
  if(part==='intro')return {label:'voice note',quote:p.intro,q:'Tell me about yourself'};
  if(part.startsWith('prompt')){const pr=p.prompts[+part.slice(6)];return {label:'answer',quote:pr[1],q:pr[0]}}
  return {label:'photo',quote:'Photo '+(+part.slice(5)+1),q:''};
}

/* ---------- Actions ---------- */
function toast(msg){toastMsg=msg;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toastMsg='';render()},2800);render()}
function currentProfile(){const q=queue();return q.length?q[0].p:null}
function toTop(){window.scrollTo(0,0)}
function afterRender(){render();toTop()}
function sendVoice(v){
  const m=S.matches.find(x=>x.id===S.chat);if(!m)return;
  m.msgs.push({from:'me',voice:v});save();
  scheduleReply(S.chat);
}
function scheduleReply(id){
  const m=S.matches.find(x=>x.id===id);const n=m.msgs.filter(x=>x.from==='them').length;
  setTimeout(()=>{const mm=S.matches.find(x=>x.id===id);if(!mm)return;const t=REPLIES[n%REPLIES.length];mm.msgs.push({from:'them',text:t,voice:{text:t,secs:secsOf(t)}});if(S.chat!==id)mm.unread=true;save();render()},1500);
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;
  if(act==='close-sheet'&&e.target.closest('[data-stop]'))return;
  switch(act){
    case 'send-otp':{if(!/^[6-9]\d{9}$/.test(ob.d.phone)){ob.err='Enter a valid 10-digit Indian mobile number.';render();return}ob.d.otpSent=true;ob.err='';render();setTimeout(()=>{const i=document.getElementById('f-otp');if(i)i.focus()},30);break;}
    case 'demo-selfie':runSelfieCheck();break;
    case 'section':{const sec=el.dataset.sec;ob={step:null,section:sec,d:JSON.parse(JSON.stringify(S.me)),err:''};recErr='';stopAudio();playing=null;afterRender();break;}
    case 'sec-cancel':stopRec();ob={step:0,d:blankDraft(),err:''};afterRender();break;
    case 'sec-save':{const e2=validateKey(ob.section);if(e2){ob.err=e2;render();return}stopRec();if(ob.section==='personality')ob.d.big5Done=true;ob.d.maxTravel=+ob.d.maxTravel||45;S.me=ob.d;ob={step:0,d:blankDraft(),err:''};save();afterRender();toast('Profile updated.');break;}
    case 'pv':{const k=el.dataset.k;S.me.privacy=S.me.privacy||{};S.me.privacy[k]=!S.me.privacy[k];save();render();break;}
    case 'ob-next':{
      if(ob.step===0){ob.step=1;ob.err='';afterRender();return}
      const key=SIGNUP[ob.step-1];
      if(key!=='selfie'){ob.err=validateKey(key);if(ob.err){render();return}}
      if(key==='basics'&&!passesGate(ob.d)){ob.step='wait';afterRender();return}
      stopRec();
      if(ob.step===SIGNUP.length){const me=JSON.parse(JSON.stringify(ob.d));finishOnboarding(me);ob={step:0,d:blankDraft(),err:''};afterRender();return}
      ob.step++;ob.err='';recErr='';afterRender();break;}
    case 'ob-back':stopRec();ob.step=Math.max(0,ob.step-1);ob.err='';afterRender();break;
    case 'ob-back-gate':ob.step=2;afterRender();break;
    case 'ob-sample':finishOnboarding(JSON.parse(JSON.stringify(SAMPLE_ME)));afterRender();break;
    case 'chip':{
      const f=el.dataset.field,v=el.dataset.val;
      if(el.dataset.multi==='1'){const arr=ob.d[f];const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else{if(f==='passions'&&arr.length>=5){ob.err='You can pick up to five passions.';render();return}arr.push(v)}}
      else ob.d[f]=f==='maxTravel'?+v:v;
      ob.err='';render();break;}
    case 'demo-photos':{const d=ob.d;let k=d.photos.length;while(d.photos.length<MIN_PHOTOS)d.photos.push({art:k++});ob.err='';render();break;}
    case 'rm-photo':ob.d.photos.splice(+el.dataset.i,1);render();break;
    case 'rec-start':startRec(el.dataset.target);break;
    case 'rec-stop':stopRec();break;
    case 'demo-voice':{const t=`Hi, I'm ${ob.d.name||'new here'}. This is a demo voice note. In the real app, you'd hear me talk about what I do, what I love, and what I'm looking for.`;ob.d.voice={text:t,secs:secsOf(t)};recErr='';ob.err='';render();break;}
    case 'play':togglePlay(el.dataset.key);break;
    case 'tab':stopAudio();playing=null;S.tab=el.dataset.tab;S.chat=null;save();afterRender();break;
    case 'focus':S.focus=el.dataset.id;stopAudio();playing=null;afterRender();break;
    case 'rate':draftRating[el.dataset.k]=+el.dataset.v;render();break;
    case 'vibe':{const v=el.dataset.v;const i=draftRating.tags.indexOf(v);if(i>=0)draftRating.tags.splice(i,1);else if(draftRating.tags.length<2)draftRating.tags.push(v);else{draftRating.tags.shift();draftRating.tags.push(v)}render();break;}
    case 'submit-rating':{const p=currentProfile();if(!p)return;S.ratings[p.id]={photo:draftRating.photo,voice:draftRating.voice,tags:[...draftRating.tags]};save();toast(`Rating saved. ${p.name}'s average now includes yours.`);break;}
    case 'like':{const p=currentProfile();if(!p)return;sheet={type:'like',id:p.id,part:el.dataset.part};render();setTimeout(()=>{const t=document.getElementById('like-note');if(t)t.focus()},50);break;}
    case 'close-sheet':case 'close-sheet-btn':sheet=null;render();break;
    case 'send-like':{
      const p=PBY[sheet.id];const note=(document.getElementById('like-note')||{}).value||'';const pt=partText(p,sheet.part);
      S.liked.push(p.id);S.likesLeft--;sheet=null;S.focus=null;stopAudio();playing=null;
      const ctx=pt.label==='photo'?`Liked your ${pt.quote.toLowerCase()}`:`Liked your ${pt.label}: "${pt.quote.length>70?pt.quote.slice(0,70)+'…':pt.quote}"`;
      if(p.likesYou){
        S.matches.push({id:p.id,unread:true,waiting:!!p.msgFirst,msgs:[{from:'me',ctx,text:note.trim()||'❤'}],plan:null});overlay={id:p.id};save();render();
        if(p.msgFirst)setTimeout(()=>{const mm=S.matches.find(x=>x.id===p.id);if(!mm)return;const t=`Hey ${S.me.name}! I liked your voice note too. Your date ideas look fun, pick one?`;mm.msgs.push({from:'them',text:t,voice:{text:t,secs:secsOf(t)}});mm.waiting=false;if(S.chat!==p.id)mm.unread=true;save();render()},4000);
      }
      else{save();toTop();toast(`Like sent to ${p.name}. You'll match if they like you back.`)}
      break;}
    case 'skip':{const p=currentProfile();if(p){S.passed.push(p.id);S.focus=null;stopAudio();playing=null;save();afterRender()}break;}
    case 'report':{const id=el.dataset.id||(currentProfile()||{}).id;if(id){sheet={type:'report',id};render()}break;}
    case 'do-report':case 'do-block':{
      const id=sheet.id;sheet=null;S.matches=S.matches.filter(m=>m.id!==id);if(!S.passed.includes(id))S.passed.push(id);S.chat=null;S.focus=null;save();toTop();
      toast(act==='do-report'?"Thanks. We'll review this report, and they've been blocked.":"Blocked. You won't see each other again.");break;}
    case 'close-overlay':overlay=null;afterRender();break;
    case 'open-chat':overlay=null;stopAudio();playing=null;S.chat=el.dataset.id;S.tab='matches';save();afterRender();break;
    case 'back-chats':stopRec();stopAudio();playing=null;S.chat=null;S.tab='matches';save();afterRender();break;
    case 'propose':{
      const m=S.matches.find(x=>x.id===S.chat);const p=PBY[S.chat];const pl=plansFor(S.me,p)[+el.dataset.i];
      m.plan=pl;m.confirmed=false;m.msgs.push({from:'me',ctx:'Proposed a date',text:`${pl.title}: ${pl.stops.map(s=>s.name).join(', then ')}. ${pl.time}.`});
      save();render();const id=S.chat;
      setTimeout(()=>{const mm=S.matches.find(x=>x.id===id);if(!mm)return;mm.confirmed=true;const t='This looks perfect. Saturday works for me!';mm.msgs.push({from:'them',text:t,voice:{text:t,secs:secsOf(t)}});if(S.chat!==id)mm.unread=true;save();render()},1600);
      break;}
    case 'send-msg':sendMsg();break;
    case 'share-plan':{
      const m=S.matches.find(x=>x.id===el.dataset.id);const p=PBY[m.id];
      const txt=`Heads up: I'm meeting ${p.name} for "${m.plan.title}". ${m.plan.stops.map(s=>s.name).join(', then ')} in ${CLUSTERS[m.plan.mid]}. ${m.plan.time}.`;
      if(navigator.share){navigator.share({text:txt}).catch(()=>{})}
      else{try{navigator.clipboard.writeText(txt).then(()=>toast('Plan copied. Paste it to a friend.'),()=>toast('Copy this: '+txt))}catch(err){toast('Copy this: '+txt)}}
      break;}
    case 'reset':stopAudio();S=fresh();ob={step:0,d:blankDraft(),err:''};save();afterRender();break;
    case 'reset-likes':S.likesLeft=10;save();render();break;
    case 'widen':S.me.maxTravel=60;save();render();break;
    case 'reset-seen':S.passed=[];S.liked=[];S.likesLeft=10;S.focus=null;save();render();break;
  }
});
function sendMsg(){
  const inp=document.getElementById('msg');if(!inp||!inp.value.trim())return;
  const m=S.matches.find(x=>x.id===S.chat);if(!m)return;
  m.msgs.push({from:'me',text:inp.value.trim()});save();render();
  scheduleReply(S.chat);
  setTimeout(()=>{const i=document.getElementById('msg');if(i)i.focus()},20);
}
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='msg'){e.preventDefault();sendMsg()}
  if(e.key==='Escape'&&(sheet||overlay)){sheet=null;overlay=null;render()}
});
document.addEventListener('input',e=>{
  const t=e.target,f=t.dataset.ob;if(!f)return;
  if(f==='big5'){ob.d.big5[+t.dataset.i]=+t.value;ob.d.big5Done=true}
  else if(f==='phone'){t.value=t.value.replace(/\D/g,'').slice(0,10);ob.d.phone=t.value}
  else if(f==='depth')ob.d.depth[t.dataset.k]=t.value;
  else ob.d[f]=t.value;
});
document.addEventListener('change',async e=>{
  if(e.target.id==='selfie-input'){if(e.target.files[0]){try{ob.d.selfie=await downscale(e.target.files[0])}catch(err){}runSelfieCheck()}return}
  if(e.target.id!=='photo-input')return;
  const files=[...e.target.files].slice(0,MAX_PHOTOS-ob.d.photos.length);
  for(const f of files){try{ob.d.photos.push({src:await downscale(f)})}catch(err){}}
  ob.err='';render();
});
if('speechSynthesis' in window)speechSynthesis.getVoices();
render();
</script>
</body>
